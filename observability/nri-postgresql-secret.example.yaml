# Copie para nri-postgresql-secret.yaml (ignorado pelo git) e preencha com a senha real do usuário
# newrelic_monitor criado no RDS. Nunca commitar o arquivo preenchido.
#
#   cp nri-postgresql-secret.example.yaml nri-postgresql-secret.yaml
#   kubectl apply -f nri-postgresql-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: nri-postgresql-db-credentials
  namespace: newrelic
type: Opaque
stringData:
  password: "__SENHA_DO_USUARIO_NEWRELIC_MONITOR__"
